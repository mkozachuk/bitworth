<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BitWorth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>BitWorth — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #f6f1e6;
        color: #3b2f2a;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          calc(env(safe-area-inset-top, 0px) + 1.5rem)
          1.5rem
          calc(env(safe-area-inset-bottom, 0px) + 1.5rem)
          1.5rem;
        min-height: 100vh;
      }

      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        background: #fcfaf4;
        border: 1px solid #d9ccae;
        border-radius: 6px;
        padding: 2.5rem 1.5rem;
      }

      .seal {
        display: block;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
      }

      h1 {
        font-family: "Iowan Old Style", Georgia, serif;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
        color: #3b2f2a;
      }

      p {
        font-size: 1rem;
        line-height: 1.5rem;
        margin: 0 0 2rem;
        color: #6f5f4d;
      }

      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #f6f1e6;
        background: #1e3a5f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 150ms ease;
      }

      .retry:hover {
        background: #162b47;
      }

      .retry:active {
        background: #162b47;
      }

      .retry:focus-visible {
        outline: 2px solid #1e3a5f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <svg class="seal" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="21.5" stroke="#c73a2b" stroke-width="3" stroke-dasharray="128 3 2 2" stroke-linecap="round" />
        <path d="M9 32 L16 24 L21 28 L29 17 L33 21 L39 13" stroke="#c73a2b" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10 38 H38" stroke="#c73a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5" />
      </svg>
      <h1>You're offline</h1>
      <p>BitWorth needs a connection to load your dashboard. Reconnect and try again.</p>
      <button type="button" class="retry" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
